# Keeps lib/versions.json fresh automatically.
name: Update pins

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-pins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Lix
        uses: samueldr/lix-gha-installer-action@a0fee77b2a98bb7c5c0ed7ae6d6ad4903dbdad0d # v2026-05-15
        with:
          extra_nix_config: |
            substituters = https://cache.nixos.org/ https://nix-community.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: Refresh lib/versions.json
        run: python3 scripts/update-pins.py

      - name: Open a PR if anything changed
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "lib/versions.json: refresh pinned Template/Engine hashes"
          title: "Automated: refresh Sikarugir Template/Engine pins"
          body-path: update-pins-notes.txt
          branch: automated/update-pins
          delete-branch: true
          add-paths: lib/versions.json
          labels: automated-pin-update
